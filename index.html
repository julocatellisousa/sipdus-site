<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="description"
      content="SIPDUS — pesquisa sobre métodos não invasivos para o monitoramento diário da glicemia."
    />

    <meta
      name="theme-color"
      content="#08b9d1"
    />

    <title>SIPDUS — Monitoramento e pesquisa</title>

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!--
      Filtros de percepção de cores.
      Eles ficam fora do conteúdo visual da página.
    -->

    <svg
      aria-hidden="true"
      width="0"
      height="0"
      style="position:absolute"
    >
      <defs>

        <filter id="filter-protanopia">
          <feColorMatrix
            type="matrix"
            values="
              0.567 0.433 0     0 0
              0.558 0.442 0     0 0
              0     0.242 0.758 0 0
              0     0     0     1 0
            "
          />
        </filter>

        <filter id="filter-deuteranopia">
          <feColorMatrix
            type="matrix"
            values="
              0.625 0.375 0     0 0
              0.7   0.3   0     0 0
              0     0.3   0.7   0 0
              0     0     0     1 0
            "
          />
        </filter>

        <filter id="filter-tritanopia">
          <feColorMatrix
            type="matrix"
            values="
              0.95  0.05  0     0 0
              0     0.433 0.567 0 0
              0     0.475 0.525 0 0
              0     0     0     1 0
            "
          />
        </filter>

      </defs>
    </svg>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
